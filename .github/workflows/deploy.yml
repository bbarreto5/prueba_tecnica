name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to ThinkPad
    runs-on: self-hosted

    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build backend frontend migrations

      - name: Start database
        run: docker compose up -d db

      - name: Run migrations
        run: docker compose run --rm migrations

      - name: Start application
        run: docker compose up -d backend frontend

      - name: Smoke test backend
        run: curl --fail http://localhost:8000/health