services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pruebaTecnica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pruebaTecnica"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pruebaTecnica
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    command: python -m app.infrastructure.database.seed
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pruebaTecnica
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      migrations:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Incident & Request Management API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pruebaTecnica
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

