services:
  db:
    image: postgres:16-alpine
    container_name: myDB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pruebaTecnica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pruebaTecnica"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ./backend
    container_name: prueba_tecnica_migrations
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pruebaTecnica
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    container_name: prueba_tecnica_seed
    command: python -m app.infrastructure.database.seed
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pruebaTecnica
    depends_on:
      migrations:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    container_name: back_prueba_tecnica
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pruebaTecnica
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://thinkpad.local:8000
    container_name: front_prueba_tecnica
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: